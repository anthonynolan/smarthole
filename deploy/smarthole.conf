# Smarthole (smarthole.cathalanddad.com) on the shared Lightsail instance.
# Grimoire owns conf.d/api.conf (loopback 8000/8001); tracker owns
# conf.d/tracker.conf (loopback 8002); smarthole proxies to 127.0.0.1:8003,
# which is never opened in the Lightsail firewall.
#
# The backend serves the whole app (API + built client dist at /), so one
# proxy location is enough -- same shape as Grimoire's api.conf.
#
# NOTE: this is the pre-TLS revision. After the first deploy, run
#   sudo certbot --nginx -d smarthole.cathalanddad.com
# on the server, then copy the server's certbot-modified
# /etc/nginx/conf.d/smarthole.conf back over this file and commit.
# The deploy script refuses to ship a conf without "managed by Certbot"
# over a live TLS conf.
server {
    server_name smarthole.cathalanddad.com;

    # .apkg/.colpkg collection backups can be tens of MB; the nginx
    # default (1m) must not reject them before they reach the app.
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/smarthole.cathalanddad.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/smarthole.cathalanddad.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = smarthole.cathalanddad.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name smarthole.cathalanddad.com;

    listen 80;
    return 404; # managed by Certbot


}